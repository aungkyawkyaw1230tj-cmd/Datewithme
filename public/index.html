<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Auth Screen (Login / Register) -->
    <div id="authScreen" class="auth-box">
      <h2 id="authTitle">Sign In</h2>
      <input type="text" id="authUsername" placeholder="Username">
      <input type="password" id="authPassword" placeholder="Password">
      <button id="authBtn" onclick="handleAuth()">Sign In</button>
      <p class="toggle-text" onclick="toggleAuthMode()">
        <span id="toggleText">အကောင့်မရှိသေးပါက ဒီမှာနှိပ်ပြီး Sign Up လုပ်ပါ</span>
      </p>
      <div id="authError" class="error-msg"></div>
    </div>

    <!-- Lobby / Matchfinding Screen -->
    <div id="lobbyScreen" class="lobby-box" style="display: none;">
      <h2>Welcome, <span id="displayUsername"></span>!</h2>
      <button id="findMatchBtn" onclick="findMatch()">Find Match 🔍</button>
      <div id="matchStatus" class="status-msg"></div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" style="display: none;">
      <div class="player-card">
        <span class="player-avatar">♟️</span>
        <span id="opponentName">Opponent</span>
      </div>

      <div class="board-wrapper">
        <div id="board" class="chess-board wood">
          <div id="board-grid" class="board-grid"></div>
        </div>
      </div>

      <div class="player-card active">
        <span class="player-avatar">♙</span>
        <span id="yourName">You</span>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
