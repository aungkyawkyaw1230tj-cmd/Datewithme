<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header UI -->
    <header class="game-header">
      <h2>Chess Myanmar</h2>
      <div class="controls">
        <label for="skinSelect">Skin: </label>
        <select id="skinSelect">
          <option value="wood">Wood</option>
          <option value="marble">Marble</option>
        </select>
      </div>
    </header>

    <!-- Top Player (Opponent) -->
    <div class="player-card">
      <div class="player-avatar">♟️</div>
      <div class="player-info">
        <span class="player-name">Opponent (Black)</span>
      </div>
    </div>

    <!-- Centered Chess Board Wrapper -->
    <div class="board-wrapper">
      <div id="board" class="chess-board wood">
        <div id="board-grid" class="board-grid"></div>
      </div>
    </div>

    <!-- Bottom Player (You) -->
    <div class="player-card active">
      <div class="player-avatar">♙</div>
      <div class="player-info">
        <span class="player-name">You (White)</span>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="client.js"></script>
</body>
</html>
